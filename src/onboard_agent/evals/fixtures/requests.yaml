# Eval fixture for psf/requests. commit_sha records what the numbers in docs/EVALS.md were
# validated against — see docs/PLAN.md decision #17 for why it isn't an enforced checkout pin in v1.
repo_url: https://github.com/psf/requests
commit_sha: dae7ef63b4df6eded86637f251fc4e3a06c3b479

questions:
  - question: "How does requests handle HTTP Basic and Digest authentication?"
    answerable: true
    expected_relevant_files:
      - src/requests/auth.py

  - question: "How does requests implement persistent sessions and cookie handling across multiple requests?"
    answerable: true
    expected_relevant_files:
      - src/requests/sessions.py

  - question: "How does requests manage HTTP connection pooling and retries at the transport-adapter layer?"
    answerable: true
    expected_relevant_files:
      - src/requests/adapters.py

  - question: "What exception type does requests raise when a request times out?"
    answerable: true
    expected_relevant_files:
      - src/requests/exceptions.py

  - question: "What's the test setup for this repo -- what testing tooling and fixtures does it use?"
    answerable: true
    expected_relevant_files:
      - pyproject.toml
      - tests/conftest.py
    notes: "pyproject.toml carries [tool.pytest.ini_options] and the test dependency group (pytest-httpbin, pytest-cov, pytest-mock, pytest-xdist, trustme) -- conftest.py alone only covers fixtures, not tooling/config."

  - question: "How does requests turn a Request into the actual bytes sent on the wire -- what is a PreparedRequest and how is it built?"
    answerable: true
    expected_relevant_files:
      - src/requests/models.py

  - question: "How does requests follow HTTP redirects, and what limits/guards does it apply?"
    answerable: true
    expected_relevant_files:
      - src/requests/sessions.py

  - question: "How does requests decode response content into text, and how does it detect the encoding when the server doesn't specify one?"
    answerable: true
    expected_relevant_files:
      - src/requests/models.py

  - question: "How is TLS/certificate verification implemented for HTTPS requests, and what do the verify/cert parameters actually control under the hood?"
    answerable: true
    expected_relevant_files:
      - src/requests/adapters.py

  - question: "How does this codebase implement GraphQL query batching?"
    answerable: false

  - question: "How does this repo schedule and manage Kubernetes pods?"
    answerable: false
