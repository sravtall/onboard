[project]
name = "onboard-agent"
version = "0.1.0"
description = "Read-only onboarding agent for Python codebases: ingest a repo, build a searchable index, answer questions with cited file/line references."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "lancedb>=0.15.0",
    "sentence-transformers>=3.0.0",
    "bm25s>=0.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "mcp>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "streamlit>=1.64.0",
]

[project.scripts]
onboard = "onboard_agent.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboard_agent"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_api_key: test calls the real Anthropic API and needs ANTHROPIC_API_KEY",
]
